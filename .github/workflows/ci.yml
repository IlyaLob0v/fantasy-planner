# Проверки из CLAUDE.md на каждый PR, установщик для Windows и APK для Android, которые можно скачать со страницы сборки.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Токену сборки нужно только читать код: артефакты выгружаются без прав на запись в репозиторий.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Проверки (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Зеркала apt изредка зависают на десятки минут: каждая попытка ограничена по времени, всего три.
      - name: Системные зависимости Tauri
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
                libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf; then
              exit 0
            fi
            echo "apt не ответил, попытка $attempt"
            sleep 10
          done
          exit 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # generate_context! в Rust читает собранный фронтенд из dist, поэтому сборка идёт до clippy.
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  server:
    name: Сервер синхронизации
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: server
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Docker-образ собирается
        run: docker build -t guild-sync:ci .

  windows:
    name: Установщик (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: pnpm build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      - name: Сборка NSIS-установщика
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: shtab-gildii-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: APK (Android)
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Android SDK уже стоит на образе ubuntu-24.04 (ANDROID_HOME), докладываем только нужный NDK.
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # Постоянный ключ из секретов, чтобы новая сборка вставала поверх старой и база на телефоне сохранялась.
      # Без секретов (например, в PR из форка) подпись разовым ключом: такую сборку можно только попробовать.
      - name: Ключ подписи
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          store="$RUNNER_TEMP/guild.jks"
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > "$store"
            password="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::Секреты ANDROID_KEYSTORE и ANDROID_KEYSTORE_PASSWORD не заданы: APK подписан разовым ключом и не обновится поверх прежней установки."
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "$store" -alias guild -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$password" -keypass "$password" -dname "CN=Shtab gildii"
          fi
          {
            echo "keyAlias=guild"
            echo "password=$password"
            echo "storeFile=$store"
          } > src-tauri/gen/android/keystore.properties

      - name: Сборка APK
        run: pnpm tauri android build --apk --target aarch64 --target armv7

      - uses: actions/upload-artifact@v4
        with:
          name: shtab-gildii-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 30
