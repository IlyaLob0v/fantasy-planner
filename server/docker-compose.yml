# Тестовый сервер на своём компьютере: `docker compose up -d` из каталога server/.
# Телефон подключается по адресу http://<IP компьютера в Wi-Fi>:8080.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
      POSTGRES_DB: guild
    volumes:
      - guild-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild"]
      interval: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://guild:guild@db:5432/guild
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  guild-db:
