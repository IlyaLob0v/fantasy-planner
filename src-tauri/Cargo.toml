[package]
name = "fantasy-planner"
version = "0.1.0"
description = "Фэнтези-ежедневник: квесты, ритуалы, хроника"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fantasy_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
