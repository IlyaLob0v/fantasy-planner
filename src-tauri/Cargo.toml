[package]
name = "fantasy-planner"
version = "0.1.0"
description = "Фэнтези-ежедневник: квесты, ритуалы, боссы и хроника дня"
authors = ["Илья <93418665+IlyaLob0v@users.noreply.github.com>"]
repository = "https://github.com/IlyaLob0v/fantasy-planner"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fantasy_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
thiserror = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
# Сверка с сервером гильдии. rustls на ring: собирается и для Android без системного OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
