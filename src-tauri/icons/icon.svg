<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3426"/>
      <stop offset="1" stop-color="#1c120c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/>
      <stop offset="0.45" stop-color="#d4a94e"/>
      <stop offset="0.75" stop-color="#a87a2a"/>
      <stop offset="1" stop-color="#e9c873"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/>
      <stop offset="0.5" stop-color="#d1a54a"/>
      <stop offset="1" stop-color="#9c6f24"/>
    </linearGradient>
    <radialGradient id="field" cx="0.42" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#9a3343"/>
      <stop offset="0.6" stop-color="#6b1e2a"/>
      <stop offset="1" stop-color="#3f0f17"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4efe2"/>
      <stop offset="0.5" stop-color="#c9c2b0"/>
      <stop offset="1" stop-color="#8e8676"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#wood)"/>
  <rect x="72" y="72" width="880" height="880" rx="182" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.7"/>

  <g filter="url(#shadow)">
    <path d="M512 150 C 620 196 730 206 808 196 L 808 500 C 808 690 680 810 512 880 C 344 810 216 690 216 500 L 216 196 C 294 206 404 196 512 150 Z"
          fill="url(#field)" stroke="url(#gold)" stroke-width="30" stroke-linejoin="round"/>
    <path d="M512 196 C 612 236 708 246 770 240 L 770 500 C 770 666 660 772 512 836 C 364 772 254 666 254 500 L 254 240 C 316 246 412 236 512 196 Z"
          fill="none" stroke="#e6c36a" stroke-opacity="0.35" stroke-width="6"/>
  </g>

  <!-- перо и меч крест-накрест: каждый нарисован вертикально и повёрнут вокруг центра щита -->
  <g transform="translate(512 552) scale(0.9) translate(-512 -540)">
    <g transform="rotate(36 512 540)">
      <path d="M512 236 C 586 296 604 420 566 540 C 552 584 532 620 516 650 L 508 650
               C 470 600 446 520 448 440 C 450 360 474 292 512 236 Z" fill="url(#goldV)"/>
      <path d="M514 330 L 560 300 M514 390 L 576 352 M514 450 L 574 414 M514 510 L 562 478 M514 570 L 546 548 M512 360 L 470 330 M512 420 L 456 392 M512 480 L 454 456 M512 540 L 464 522" stroke="#8a6120" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <path d="M512 270 C 516 400 514 520 512 650" stroke="#7a5418" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M504 650 L 520 650 L 518 760 L 512 812 L 506 760 Z" fill="#f3e6c4"/>
      <path d="M512 770 L 512 800" stroke="#2b1a10" stroke-width="3"/>
    </g>
    <g transform="rotate(-36 512 540)">
      <path d="M490 278 L 512 236 L 534 278 L 534 652 L 490 652 Z" fill="url(#steel)"/>
      <path d="M512 252 L 512 648" stroke="#7d7566" stroke-width="5"/>
      <rect x="424" y="648" width="176" height="32" rx="14" fill="url(#gold)"/>
      <rect x="496" y="680" width="32" height="92" rx="8" fill="#4a2a1a"/>
      <path d="M496 702 L 528 712 M496 728 L 528 738 M496 754 L 528 764" stroke="#2a170e" stroke-width="5"/>
      <circle cx="512" cy="794" r="26" fill="url(#gold)"/>
    </g>
  </g>

  <!-- путеводная звезда -->
  <path d="M512 232 L 526 278 L 572 292 L 526 306 L 512 352 L 498 306 L 452 292 L 498 278 Z" fill="#fff4cf" opacity="0.95"/>
</svg>
